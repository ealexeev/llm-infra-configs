[program:hermes-gateway]
command=/opt/hermes-agent/venv/bin/python -m hermes_cli.main gateway run --replace
directory=/workspace/.hermes/
user=hermes

environment=
    PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/go/bin:/opt/hermes-agent/venv/bin:/opt/hermes-agent/node_modules/.bin",
    VIRTUAL_ENV="/opt/hermes-agent/venv",
    HOME=/workspace

autostart=true
autorestart=unexpected
startsecs=10
exitcodes=0

stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true

stdout_logfile=/workspace/.hermes/logs/hermes-gateway.out.log
stderr_logfile=/workspace/.hermes/logs/hermes-gateway.err.log